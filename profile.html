
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | MyWebsite</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <!-- PROFILE NAVIGATION -->
    <header class="profile-navbar">

        <a href="index.html" class="logo">
            MyWebsite
        </a>

        <a href="index.html" class="back-link">
            Back to Home
        </a>

    </header>


    <!-- PROFILE CONTENT -->
    <main class="profile-container">

        <section class="profile-card">

            <div class="profile-heading">
                <div class="profile-avatar" id="profileAvatar">
                    U
                </div>

                <h1 id="profileName">User Name</h1>

                <p id="profileEmail">user@email.com</p>

                <span class="account-status">
                    Active Account
                </span>
            </div>


            <!-- PERSONAL INFORMATION -->
            <div class="profile-information">

                <h2>Personal Information</h2>

                <div class="info-group">
                    <label>Full Name</label>
                    <p id="detailName">-</p>
                </div>

                <div class="info-group">
                    <label>Email Address</label>
                    <p id="detailEmail">-</p>
                </div>

                <div class="info-group">
                    <label>Username</label>
                    <p id="detailUsername">-</p>
                </div>

                <div class="info-group">
                    <label>Account Type</label>
                    <p id="accountType">Registered User</p>
                </div>

            </div>


            <!-- PROFILE ACTIONS -->
            <div class="profile-actions">

                <a href="index.html" class="home-button">
                    Return to Homepage
                </a>

                <button id="logoutBtn" class="logout-button">
                    Logout
                </button>

            </div>

        </section>

    </main>

    <script src="profile.js"></script>

</body>
</html>
